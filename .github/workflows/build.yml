name: Compilar app

on:
  push:
    branches: [main, 'version-*']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: neura-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  ios:
    name: iOS (comprobación)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx cap sync ios
      # shortcut: compila para simulador sin firmar; para instalar en iPhone o App Store hacen falta certificados de Apple como secretos
      - run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build | tail -40
          ; exit ${PIPESTATUS[0]}
        shell: bash

  bridge:
    name: Tests del puente MCP y del Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test bridge/test.mjs
      - run: node --test test/md.test.cjs

  desktop:
    name: PC (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      # shortcut: instaladores sin firmar; Windows/macOS avisarán al abrirlos (ver docs/ESCRITORIO-Y-OLLAMA.md)
      - run: npx electron-builder --publish never
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: neura-pc-${{ runner.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.zip
          retention-days: 14

  # Al subir una rama version-X.Y.Z (o una etiqueta vX.Y.Z) se publica la versión con todos los instaladores en GitHub Releases.
  release:
    name: Publicar versión
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/version-')
    needs: [android, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - id: v
        run: |
          V="${GITHUB_REF_NAME#version-}"; V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          mkdir dist
          cp out/neura-android-apk/app-debug.apk "dist/Neura-$V-Android.apk"
          find out/neura-pc-* -type f -exec cp {} dist/ \;
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Neura v${{ steps.v.outputs.version }}
          files: dist/*
          generate_release_notes: true
          # La nueva queda como principal ("Latest"); las anteriores siguen debajo como versiones desfasadas.
          make_latest: true
